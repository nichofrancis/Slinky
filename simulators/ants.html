<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ant Colony</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e;
      --accent: #4caf50; --text: #e2e2f0; --muted: #6b6b8a;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem;
      background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
    .back { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    .back:hover { color: var(--text); }
    h1 { font-size: 1.1rem; font-weight: 700; }
    .controls { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; flex: 1; }
    button { background: var(--border); border: 1px solid #2a2a3e; color: var(--text);
      padding: 0.35rem 0.85rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    button:hover { background: var(--accent); border-color: var(--accent); }
    button.active { background: var(--accent); border-color: var(--accent); }
    label { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
    input[type=range] { width: 70px; accent-color: var(--accent); }
    canvas { display: block; }
    .canvas-wrap { flex: 1; overflow: hidden; position: relative; }
    .legend { position: absolute; bottom: 8px; right: 10px; font-size: 0.75rem; color: var(--muted);
      display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
    .leg-row { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    footer { padding: 0.4rem 1rem; background: var(--surface); border-top: 1px solid var(--border);
      font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }
  </style>
</head>
<body>
<header>
  <a class="back" href="../index.html">← Back</a>
  <h1>Ant Colony</h1>
  <div class="controls">
    <button id="btn-reset">Reset</button>
    <button id="btn-add-food">+ Food</button>
    <label>Ants <input type="range" id="ant-count" min="20" max="500" value="150"><span id="lbl-ants">150</span></label>
    <label>Decay <input type="range" id="decay" min="0.990" max="0.9999" step="0.0001" value="0.997"><span id="lbl-decay">0.997</span></label>
    <label>Wander <input type="range" id="wander" min="0.1" max="1.5" step="0.05" value="0.45"><span id="lbl-wander">0.45</span></label>
    <label>Strength <input type="range" id="strength" min="1" max="10" step="0.5" value="4"><span id="lbl-str">4</span></label>
  </div>
</header>
<div class="canvas-wrap" id="wrap">
  <canvas id="canvas"></canvas>
  <div class="legend">
    <div class="leg-row"><div class="dot" style="background:#ffd700"></div>Food source</div>
    <div class="leg-row"><div class="dot" style="background:#ff6b35"></div>Home colony</div>
    <div class="leg-row"><div class="dot" style="background:rgba(80,200,100,0.9)"></div>To-food trail</div>
    <div class="leg-row"><div class="dot" style="background:rgba(100,160,255,0.9)"></div>To-home trail</div>
  </div>
</div>
<footer>Ants deposit pheromone trails — short paths reinforce, long paths fade. Click to add food.</footer>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');

let W, H, COLS, ROWS;
const CELL = 3;

// Trail buffers: 0=toFood, 1=toHome
let trailFood, trailHome;
let ants = [];
let foodSources = [];
let colony = null;
let imageData;

let params = { antCount:150, decay:0.997, wander:0.45, strength:4 };

function resize() {
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = W; canvas.height = H;
  COLS = Math.floor(W / CELL);
  ROWS = Math.floor(H / CELL);
  trailFood = new Float32Array(COLS * ROWS);
  trailHome = new Float32Array(COLS * ROWS);
  imageData = ctx.createImageData(W, H);
}

function tIdx(c, r) { return r * COLS + c; }
function inBounds(c, r) { return c >= 0 && c < COLS && r >= 0 && r < ROWS; }

class Ant {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = colony.x + (Math.random() - 0.5) * 4;
    this.y = colony.y + (Math.random() - 0.5) * 4;
    this.angle = Math.random() * Math.PI * 2;
    this.hasFood = false;
    this.stepsSince = 0;
  }
  sense(trail, ang) {
    const SO = 12, SA = Math.PI / 5;
    let sum = 0;
    for (let da = -SA; da <= SA; da += SA) {
      const sx = Math.round(this.x + Math.cos(ang + da) * SO);
      const sy = Math.round(this.y + Math.sin(ang + da) * SO);
      if (inBounds(sx, sy)) sum += trail[tIdx(sx, sy)];
    }
    return sum;
  }
  update() {
    this.stepsSince++;
    const trail = this.hasFood ? trailHome : trailFood;

    // Sense
    const SA = Math.PI / 5;
    const fwd = this.sense(trail, this.angle);
    const lft = this.sense(trail, this.angle - SA);
    const rgt = this.sense(trail, this.angle + SA);

    let steer = (Math.random() - 0.5) * params.wander;
    if (fwd < lft && fwd < rgt) steer += (Math.random() < 0.5 ? 1 : -1) * SA;
    else if (lft > rgt) steer -= SA * 0.5;
    else if (rgt > lft) steer += SA * 0.5;
    this.angle += steer;

    const speed = 1.5;
    const nx = this.x + Math.cos(this.angle) * speed;
    const ny = this.y + Math.sin(this.angle) * speed;

    if (nx < 0 || nx >= W) { this.angle = Math.PI - this.angle; }
    if (ny < 0 || ny >= H) { this.angle = -this.angle; }
    this.x = Math.max(0, Math.min(W - 1, nx));
    this.y = Math.max(0, Math.min(H - 1, ny));

    const gc = Math.round(this.x), gr = Math.round(this.y);

    // Deposit trail
    if (inBounds(gc, gr)) {
      const deposit = params.strength * (this.hasFood ? 1 : 0.8);
      if (this.hasFood) trailHome[tIdx(gc, gr)] = Math.min(1, trailHome[tIdx(gc, gr)] + deposit * 0.02);
      else trailFood[tIdx(gc, gr)] = Math.min(1, trailFood[tIdx(gc, gr)] + deposit * 0.015);
    }

    // Check food
    if (!this.hasFood) {
      for (const f of foodSources) {
        const dx = this.x - f.x, dy = this.y - f.y;
        if (Math.sqrt(dx*dx+dy*dy) < f.r) {
          this.hasFood = true;
          this.angle += Math.PI;
          f.food = Math.max(0, f.food - 1);
          break;
        }
      }
    }

    // Check colony
    if (this.hasFood) {
      const dx = this.x - colony.x, dy = this.y - colony.y;
      if (Math.sqrt(dx*dx+dy*dy) < 12) {
        this.hasFood = false;
        this.angle += Math.PI;
        this.stepsSince = 0;
      }
    }

    // Lost ant — boost home pheromone following when carrying food
    if (this.stepsSince > 400) { this.angle += Math.PI; this.stepsSince = 0; }
  }
}

function init() {
  colony = { x: W * 0.2, y: H * 0.5 };
  foodSources = [
    { x: W * 0.75, y: H * 0.3, r: 14, food: 1000 },
    { x: W * 0.78, y: H * 0.7, r: 12, food: 1000 },
    { x: W * 0.55, y: H * 0.18, r: 10, food: 800 },
  ];
  trailFood.fill(0);
  trailHome.fill(0);
  ants = Array.from({ length: params.antCount }, () => new Ant());
}

function step() {
  // Decay trails
  for (let i = 0; i < trailFood.length; i++) {
    trailFood[i] *= params.decay;
    trailHome[i] *= params.decay;
  }
  for (const a of ants) a.update();
}

function draw() {
  const img = imageData;
  // Render trails
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tf = trailFood[tIdx(c, r)];
      const th = trailHome[tIdx(c, r)];
      for (let dy = 0; dy < CELL; dy++) {
        for (let dx = 0; dx < CELL; dx++) {
          const px = (r * CELL + dy) * W + (c * CELL + dx);
          const i = px * 4;
          img.data[i]   = Math.floor(Math.min(255, tf * 80 + th * 100));
          img.data[i+1] = Math.floor(Math.min(255, tf * 200 + th * 160));
          img.data[i+2] = Math.floor(Math.min(255, tf * 100 + th * 255));
          img.data[i+3] = 255;
        }
      }
    }
  }
  ctx.putImageData(img, 0, 0);

  // Colony
  ctx.beginPath();
  ctx.arc(colony.x, colony.y, 12, 0, Math.PI * 2);
  ctx.fillStyle = '#ff6b35';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Food
  for (const f of foodSources) {
    if (f.food <= 0) continue;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd700';
    ctx.fill();
    ctx.strokeStyle = '#fff8';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Ants
  for (const a of ants) {
    ctx.fillStyle = a.hasFood ? '#ffd700' : 'rgba(255,200,150,0.85)';
    ctx.fillRect(a.x - 1, a.y - 1, 2.5, 2.5);
  }
}

function loop() {
  requestAnimationFrame(loop);
  for (let i = 0; i < 3; i++) step();
  draw();
}

// Controls
function bind(id, key, lbl) {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    params[key] = +el.value;
    document.getElementById(lbl).textContent = el.value;
  });
}
bind('decay','decay','lbl-decay');
bind('wander','wander','lbl-wander');
bind('strength','strength','lbl-str');

document.getElementById('ant-count').addEventListener('input', e => {
  params.antCount = +e.target.value;
  document.getElementById('lbl-ants').textContent = e.target.value;
  ants = Array.from({ length: params.antCount }, () => new Ant());
});

document.getElementById('btn-reset').addEventListener('click', init);
document.getElementById('btn-add-food').addEventListener('click', () => {
  // Add food at random location
  foodSources.push({
    x: W * (0.4 + Math.random() * 0.5),
    y: H * (0.15 + Math.random() * 0.7),
    r: 10 + Math.random() * 8,
    food: 600
  });
});

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  foodSources.push({ x: e.clientX - r.left, y: e.clientY - r.top, r: 12, food: 800 });
});

window.addEventListener('resize', () => { resize(); init(); });

resize();
init();
loop();

// ── Sound ─────────────────────────────────────────────────────────────────────
const snd = (() => {
  let _ctx;
  const ac = () => _ctx || (_ctx = new (window.AudioContext||window.webkitAudioContext)());
  function tone(f0, f1, dur, vol=0.12, type='square') {
    const c=ac(), o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination); o.type=type;
    o.frequency.setValueAtTime(f0, c.currentTime);
    if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), c.currentTime+dur);
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
    o.start(); o.stop(c.currentTime+dur+0.01);
  }
  function noise(dur, cf=1500, vol=0.1) {
    const c=ac(), n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    const src=c.createBufferSource(), filt=c.createBiquadFilter(), g=c.createGain();
    src.buffer=buf; filt.type='bandpass'; filt.frequency.value=cf; filt.Q.value=0.8;
    src.connect(filt); filt.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
    src.start(); src.stop(c.currentTime+dur+0.01);
  }
  return {
    whoosh: () => noise(0.18, 600, 0.13),
    pop:    () => tone(720, 360, 0.07, 0.13, 'sine'),
  };
})();
document.getElementById('btn-reset').addEventListener('mousedown', () => snd.whoosh());
document.getElementById('btn-add-food').addEventListener('mousedown', () => snd.pop());
canvas.addEventListener('click', () => snd.pop());
</script>
</body>
</html>
